[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "queryfind"
version = "0.1.0"
description = "Natural-language local file search for macOS"
readme = "PROJECT.md"
requires-python = ">=3.12"
dependencies = [
  "rich==13.9.4",
]

[project.scripts]
queryfind = "queryfind.cli:main"

[tool.setuptools.packages.find]
include = ["queryfind*"]
